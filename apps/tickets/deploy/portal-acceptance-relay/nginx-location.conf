# Installed inside the existing seller-share.homesbliss.net HTTPS server block.
location = /ops-portal-acceptance/healthz {
    proxy_pass http://portal_acceptance_relay/healthz;
    proxy_set_header Host $host;
}

location = /ops-portal-acceptance/accept {
    limit_req zone=portal_acceptance burst=10 nodelay;
    limit_except GET { deny all; }
    proxy_pass http://portal_acceptance_relay/accept$is_args$args;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_hide_header Server;
}
