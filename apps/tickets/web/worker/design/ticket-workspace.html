<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ticket Workspace — Homebliss</title>
<style>
/* ── Reset & Base ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f0f2f5;--surface:#fff;--sidebar-w:360px;--header-h:52px;--accent:#0f3460;--accent-light:#1a4a8a;--accent-bg:#eef2ff;--danger:#dc2626;--danger-bg:#fef2f2;--success:#16a34a;--success-bg:#f0fdf4;--warning:#d97706;--warning-bg:#fffbeb;--border:#e5e7eb;--text:#1f2937;--text-muted:#6b7280;--text-xs:#9ca3af;--radius:8px;--radius-sm:6px;--shadow-sm:0 1px 2px rgba(0,0,0,0.05);--shadow-md:0 4px 12px rgba(0,0,0,0.08);--transition:0.15s ease}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
.hidden{display:none!important}

/* ── Login Gate ── */
.gate{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1a1a2e,#16213e 60%,#0f3460)}
.gate-box{background:#fff;border-radius:16px;padding:48px 40px;width:360px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.gate-box h1{font-size:1.6rem;margin-bottom:4px}
.gate-subtitle{color:#666;font-size:0.85rem;margin-bottom:24px}
.gate-box input[type="password"]{width:100%;padding:12px 14px;border:1.5px solid #ddd;border-radius:8px;font-size:0.95rem;margin-bottom:10px;outline:none;transition:border-color .2s}
.gate-box input:focus{border-color:var(--accent)}
.gate-box button{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:0.95rem;font-weight:600;cursor:pointer;transition:background .2s}
.gate-box button:hover{background:var(--accent-light)}
.gate-error{color:#e53e3e;font-size:0.8rem;margin-top:10px;display:none}

/* ── Header ── */
#header{height:var(--header-h);background:var(--accent);color:#fff;display:flex;align-items:center;padding:0 20px;gap:16px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,0.15);position:relative;z-index:10}
#header .logo{font-weight:700;font-size:13px;letter-spacing:.02em}
#header .header-right{margin-left:auto;display:flex;align-items:center;gap:12px}
#header .shop-badge{font-size:11px;background:rgba(255,255,255,0.15);padding:3px 10px;border-radius:12px;border:1px solid rgba(255,255,255,0.2)}
.btn-sm{font-size:11px;padding:5px 14px;border-radius:var(--radius-sm);border:1px solid transparent;cursor:pointer;font-weight:600;transition:background var(--transition),opacity var(--transition);line-height:1.4}
.btn-sm:disabled{opacity:0.5;cursor:not-allowed}
.btn-sm.outline{background:transparent;color:#fff;border-color:rgba(255,255,255,0.35)}
.btn-sm.outline:hover{background:rgba(255,255,255,0.12)}

/* ── Layout ── */
#workspace{display:flex;height:calc(100vh - var(--header-h));overflow:hidden}

/* ── Left Sidebar ── */
#sidebar{width:var(--sidebar-w);min-width:300px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
#sidebar-header{padding:12px 14px 8px;border-bottom:1px solid var(--border);flex-shrink:0}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.filter-row input[type="text"]{flex:1;min-width:100px;padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;outline:none;transition:border-color var(--transition);font-family:inherit}
.filter-row input:focus{border-color:var(--accent)}
.filter-row select{padding:5px 6px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:11px;outline:none;background:#fff;cursor:pointer;font-family:inherit}
.filter-row select:focus{border-color:var(--accent)}
.filter-row .filter-label{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-xs);display:flex;align-items:center}
.ticket-count{font-size:11px;color:var(--text-muted);padding:4px 0 6px;display:flex;justify-content:space-between;align-items:center}
.load-more-btn{font-size:10px;color:var(--accent);background:none;border:1px solid var(--accent);border-radius:var(--radius-sm);padding:3px 10px;cursor:pointer}
.load-more-btn:hover{background:var(--accent-bg)}
.load-more-btn:disabled{opacity:0.4;cursor:not-allowed}

#ticket-list{flex:1;overflow-y:auto;list-style:none}
.ticket-card{padding:10px 14px;border-bottom:1px solid #f3f4f6;cursor:pointer;transition:background var(--transition),border-color var(--transition);border-left:3px solid transparent}
.ticket-card:hover{background:#f9fafb}
.ticket-card.active{background:var(--accent-bg);border-left-color:var(--accent)}
.ticket-card .tc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:3px}
.ticket-card .tc-order{font-weight:700;font-size:11px;color:var(--accent);font-family:"SF Mono","Fira Code",monospace}
.ticket-card .tc-status{font-size:9px;font-weight:600;padding:2px 6px;border-radius:10px;white-space:nowrap}
.status-open{background:#dbeafe;color:#1e40af}
.status-awaiting{background:#fef3c7;color:#92400e}
.status-received{background:#d1fae5;color:#065f46}
.status-progress{background:#e0e7ff;color:#3730a3}
.status-resolved{background:#e5e7eb;color:#4b5563}
.status-unresolved{background:#fee2e2;color:#991b1b}
.ticket-card .tc-meta{font-size:10px;color:var(--text-muted);margin-bottom:2px;display:flex;gap:8px;align-items:center}
.ticket-card .tc-meta .shop-tag{background:#f3f4f6;padding:1px 5px;border-radius:4px;font-size:9px;font-weight:600}
.ticket-card .tc-preview{font-size:10px;color:var(--text-xs);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.ticket-card .tc-badges{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}
.ticket-card .tc-badges .badge{font-size:8px;padding:1px 6px;border-radius:8px;font-weight:600}
.badge-needs-reply{background:var(--warning-bg);color:var(--warning)}
.badge-stale{background:var(--danger-bg);color:var(--danger)}
.loading-row{padding:24px 14px;text-align:center;color:var(--text-muted);font-size:11px}
.empty-row{padding:40px 14px;text-align:center;color:var(--text-xs);font-size:11px}

/* ── Right Panel ── */
#detail-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#detail-placeholder{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-xs);font-size:13px}
#detail-content{flex:1;display:flex;flex-direction:column;overflow:hidden}
#detail-scroll{flex:1;overflow-y:auto;padding:16px 20px}
.detail-top{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.detail-top .order-id{font-size:15px;font-weight:700;color:var(--accent);font-family:"SF Mono","Fira Code",monospace}
.detail-top .shop-tag{background:var(--accent-bg);color:var(--accent);padding:2px 8px;border-radius:12px;font-size:10px;font-weight:600}
.detail-top .platform-tag{background:#f3f4f6;padding:2px 8px;border-radius:12px;font-size:10px}
.detail-top .refresh-btn{margin-left:auto;font-size:10px;background:none;border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px 10px;cursor:pointer;color:var(--text-muted);transition:all var(--transition)}
.detail-top .refresh-btn:hover{background:#f3f4f6;color:var(--text)}


/* ── Info Grid ── */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;margin-bottom:16px;padding:12px 16px;background:#f9fafb;border-radius:var(--radius);border:1px solid var(--border)}
.info-item .label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:1px}
.info-item .value{font-size:12px;font-weight:500}
.info-grid select.status-select{padding:3px 6px;border-radius:var(--radius-sm);border:1px solid var(--border);font-size:11px;font-weight:600;cursor:pointer;outline:none;font-family:inherit}
.info-grid select.status-select:focus{border-color:var(--accent)}

/* ── Tabs ── */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:14px;flex-shrink:0}
.tab-btn{padding:7px 16px;border:none;background:none;font-size:11px;font-weight:600;cursor:pointer;color:var(--text-muted);transition:color var(--transition),border-color var(--transition);border-bottom:2px solid transparent;margin-bottom:-2px;font-family:inherit}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-btn:hover{color:var(--text)}

/* ── Messages ── */
.msg-thread{display:flex;flex-direction:column;gap:10px}
.msg-bubble{max-width:80%;padding:8px 12px;border-radius:10px;font-size:12px;line-height:1.6;position:relative;word-wrap:break-word;white-space:pre-wrap}
.msg-bubble.buyer{align-self:flex-start;background:#f3f4f6;border-bottom-left-radius:4px}
.msg-bubble.seller{align-self:flex-end;background:var(--accent-bg);border-bottom-right-radius:4px;color:var(--accent)}
.msg-meta{font-size:9px;color:var(--text-xs);margin-bottom:2px}
.msg-bubble img{max-width:180px;border-radius:var(--radius-sm);margin-top:4px;cursor:pointer;border:1px solid var(--border)}

/* ── Images ── */
.image-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.image-card{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:box-shadow var(--transition)}
.image-card:hover{box-shadow:var(--shadow-md)}
.image-card img{width:100%;height:160px;object-fit:cover;display:block}
.image-card .img-tag{font-size:9px;padding:3px 6px;color:var(--text-muted)}

/* ── Description ── */
.desc-section{margin-bottom:14px}
.desc-section h4{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);margin-bottom:4px}
.desc-section p{font-size:12px;line-height:1.7}
.desc-section .form-label{font-size:9px;color:var(--text-xs);margin-top:4px}

/* ── Notes Tab ── */
.notes-list{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.note-item{padding:10px 12px;background:#f9fafb;border-radius:var(--radius-sm);border:1px solid var(--border)}
.note-item .note-header{display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted);margin-bottom:4px}
.note-item .note-date{font-weight:600}
.note-item .note-text{font-size:12px;line-height:1.6;white-space:pre-wrap}
.note-form textarea{width:100%;min-height:50px;padding:8px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:11px;font-family:inherit;resize:vertical;outline:none;line-height:1.5}
.note-form textarea:focus{border-color:var(--accent)}
.note-form .note-actions{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}

/* ── Response Composer ── */
#composer{border-top:2px solid var(--border);background:var(--surface);padding:16px 20px;flex-shrink:0}
#composer .composer-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#composer h3{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted)}
.composer-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.composer-left{flex:1;display:flex;flex-direction:column;gap:6px}
#resolution-guide{width:100%;min-height:70px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:11px;font-family:inherit;resize:vertical;outline:none;line-height:1.5}
#resolution-guide:focus{border-color:var(--accent)}
.btn-ai{padding:6px 14px;font-size:10px;font-weight:600;white-space:nowrap;border-radius:var(--radius-sm);border:1px solid var(--accent);background:var(--accent-bg);color:var(--accent);cursor:pointer;transition:all var(--transition);display:inline-flex;align-items:center;gap:5px}
.btn-ai:hover:not(:disabled){background:var(--accent);color:#fff}
.btn-ai:disabled{opacity:0.5;cursor:not-allowed}
.btn-ai .spinner{display:none;width:11px;height:11px;border:2px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.btn-ai.loading .spinner{display:inline-block}
.btn-ai.loading .btn-label{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
#draft-editor{width:100%;min-height:180px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;font-family:inherit;resize:vertical;outline:none;line-height:1.7}
#draft-editor:focus{border-color:var(--accent)}
.composer-actions{display:flex;gap:6px;justify-content:flex-end;align-items:center;margin-top:6px}
.btn-send{padding:7px 22px;font-size:11px;font-weight:700;border:none;border-radius:var(--radius-sm);cursor:pointer;background:var(--accent);color:#fff;transition:background var(--transition);font-family:inherit}
.btn-send:hover:not(:disabled){background:var(--accent-light)}
.btn-send:disabled{opacity:0.5;cursor:not-allowed}
.btn-sm.secondary{padding:6px 14px;font-size:10px;font-weight:600;background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:background var(--transition);color:var(--text-muted)}
.btn-sm.secondary:hover:not(:disabled){background:#f9fafb}
.send-status{font-size:10px;margin-left:auto}
.send-status.success{color:var(--success)}
.send-status.error{color:var(--danger)}
.send-status.sending{color:var(--warning)}

/* ── Confirm Dialog ── */
#confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:250;display:none;align-items:center;justify-content:center}
#confirm-overlay.show{display:flex}
.confirm-box{background:#fff;border-radius:var(--radius);padding:24px 28px;max-width:680px;width:90%;box-shadow:var(--shadow-md)}
.confirm-box h3{font-size:14px;margin-bottom:8px}
.confirm-box p{font-size:12px;color:var(--text-muted);margin-bottom:6px;line-height:1.6}
.confirm-box .confirm-preview{background:#f9fafb;border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;font-size:13px;white-space:pre-wrap;max-height:50vh;overflow-y:auto;margin:8px 0 14px}
.confirm-box .confirm-actions{display:flex;gap:8px;justify-content:flex-end}
.btn-confirm{padding:8px 24px;font-size:12px;font-weight:700;border:none;border-radius:var(--radius-sm);cursor:pointer}
.btn-confirm.cancel{background:#f3f4f6;color:var(--text-muted)}
.btn-confirm.cancel:hover{background:#e5e7eb}
.btn-confirm.ok{background:var(--danger);color:#fff}
.btn-confirm.ok:hover{background:#b91c1c}

/* ── Toast ── */
#toast{position:fixed;bottom:24px;right:24px;z-index:200;padding:8px 18px;border-radius:var(--radius-sm);font-size:11px;font-weight:600;box-shadow:var(--shadow-md);opacity:0;transform:translateY(10px);transition:all .3s ease;pointer-events:none}
#toast.show{opacity:1;transform:translateY(0)}
#toast.info{background:#dbeafe;color:#1e40af}
#toast.success{background:#d1fae5;color:#065f46}
#toast.error{background:#fee2e2;color:#991b1b}

/* ── Lightbox ── */
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:300;display:none;align-items:center;justify-content:center;cursor:pointer}
#lightbox.show{display:flex}
#lightbox img{max-width:90vw;max-height:90vh;border-radius:4px}
#lightbox-toolbar{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:301;display:flex;gap:8px;cursor:default}
.lb-btn{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);color:#fff;padding:8px 18px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;transition:background .15s;display:flex;align-items:center;gap:5px;line-height:1.4}
.lb-btn:hover{background:rgba(255,255,255,0.25)}

/* ── Responsive ── */
@media(max-width:768px){
  #workspace{flex-direction:column}
  #sidebar{width:100%;height:35vh;border-right:none;border-bottom:1px solid var(--border)}
  #detail-panel{height:65vh}
  .info-grid{grid-template-columns:1fr}
  .lb-btn{padding:10px 20px;font-size:14px;min-height:44px}
}
</style>
</head>
<body>

<!-- ══════════ Login Gate ══════════ -->
<div id="gate" class="gate">
  <div class="gate-box">
    <h1>&#x1F3E0; Homebliss</h1>
    <p class="gate-subtitle">Ticket Workspace</p>
    <input id="password-input" type="password" placeholder="&#x30D1;&#x30B9;&#x30EF;&#x30FC;&#x30C9;&#x3092;&#x5165;&#x529B;" autofocus />
    <button id="login-btn">&#x30ED;&#x30B0;&#x30A4;&#x30F3;</button>
    <p id="gate-error" class="gate-error">&#x30D1;&#x30B9;&#x30EF;&#x30FC;&#x30C9;&#x304C;&#x6B63;&#x3057;&#x304F;&#x3042;&#x308A;&#x307E;&#x305B;&#x3093;</p>
  </div>
</div>

<!-- ══════════ Main App ══════════ -->
<div id="app" class="hidden">

  <!-- Header -->
  <div id="header">
    <span class="logo">&#x1F3E0; Homebliss Ticket Workspace</span>
    <div class="header-right">
      <span class="shop-badge" id="active-shop-badge">All Shops</span>
      <button class="btn-sm outline" onclick="handleLogout()">Logout</button>
    </div>
  </div>

  <!-- Workspace Layout -->
  <div id="workspace">

    <!-- ═══ LEFT SIDEBAR ═══ -->
    <aside id="sidebar">
      <div id="sidebar-header">
        <div class="filter-row">
          <input type="text" id="search-input" placeholder="Search by Order ID..." oninput="debounceSearch()" />
        </div>
        <div class="filter-row">
          <span class="filter-label">Shop</span>
          <select id="shop-filter" onchange="applyFilters()">
            <option value="">All</option>
            <option value="Shop1">Shop1</option>
            <option value="Shop2">Shop2</option>
            <option value="Shop3">Shop3</option>
            <option value="Shop4">Shop4</option>
          </select>
          <span class="filter-label">Status</span>
          <select id="status-filter" onchange="applyFilters()">
            <option value="">All</option>
            <option value="Open">Open</option>
            <option value="Awaiting Customer Form">Awaiting Form</option>
            <option value="Customer Form Received">Form Received</option>
            <option value="In Progress">In Progress</option>
            <option value="Closed Resolved">Closed Resolved</option>
            <option value="Closed Unresolved">Closed Unresolved</option>
          </select>
          <span class="filter-label">Reply</span>
          <select id="reply-filter" onchange="applyFilters()">
            <option value="">All</option>
            <option value="yes">Needs Reply</option>
            <option value="no">No Reply Needed</option>
          </select>
        </div>
        <div class="ticket-count">
          <span id="ticket-count-text">-- tickets</span>
          <button id="load-more-btn" class="load-more-btn hidden" onclick="loadMore()">Load More</button>
        </div>
      </div>
      <ul id="ticket-list">
        <li class="loading-row">Loading tickets...</li>
      </ul>
    </aside>

    <!-- ═══ RIGHT PANEL ═══ -->
    <div id="detail-panel">
      <div id="detail-placeholder">
        <p>&larr; Select a ticket from the list</p>
      </div>
      <div id="detail-content" class="hidden">
        <div id="detail-scroll">
          <div class="detail-top" id="detail-top"></div>
          <div class="info-grid" id="info-grid"></div>
          <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('messages')">Messages</button>
            <button class="tab-btn" onclick="switchTab('images')">Images</button>
            <button class="tab-btn" onclick="switchTab('description')">Description</button>
            <button class="tab-btn" onclick="switchTab('notes')">Notes</button>
          </div>
          <div id="tab-messages" class="msg-thread"></div>
          <div id="tab-images" class="image-grid hidden"></div>
          <div id="tab-description" class="hidden"></div>
          <div id="tab-notes" class="hidden"></div>
        </div>

        <!-- Response Composer -->
        <div id="composer">
          <div class="composer-header">
            <h3>Response Composer</h3>
          </div>
          <div class="composer-row">
            <div class="composer-left">
              <textarea id="resolution-guide" placeholder="Resolution guide (e.g. refund 300 yen, send replacement) — used as AI copywriting context"></textarea>
              <button class="btn-ai" id="btn-copywrite" onclick="generateAIReply()">
                <span class="spinner"></span>
                <span class="btn-label">&#x2728; Copywrite (DeepSeek)</span>
              </button>
            </div>
          </div>
          <textarea id="draft-editor" placeholder="Draft reply message — edit before sending..."></textarea>
          <div class="composer-actions">
            <span id="send-status" class="send-status"></span>
            <button class="btn-sm secondary" id="btn-save-draft" onclick="saveToDraft()">Save Draft</button>
            <button class="btn-send" id="btn-send" onclick="confirmSend()">Send Reply</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Confirm Send Dialog -->
<div id="confirm-overlay">
  <div class="confirm-box">
    <h3>Confirm Send</h3>
    <p>This message will be sent to the customer via Mercari API.</p>
    <div class="confirm-preview" id="confirm-preview"></div>
    <div class="confirm-actions">
      <button class="btn-confirm cancel" onclick="closeConfirm()">Cancel</button>
      <button class="btn-confirm ok" onclick="executeSend()">Send</button>
    </div>
  </div>
</div>

<!-- Toast & Lightbox -->
<div id="toast"></div>
<div id="lightbox" onclick="closeLightbox()"><img id="lightbox-img" src="" alt="" /><div id="lightbox-toolbar" onclick="event.stopPropagation()"><button class="lb-btn" onclick="downloadCurrentImage()">Download</button></div></div>

<script>
// ── Config ──
const SESSION_KEY = "hb_report_token";
const PAGE_SIZE = 20;

// ── State ──

// ── Status Helpers ──
const STATUS_OPTIONS = ['Open','Awaiting Customer Form','Customer Form Received','In Progress','Closed Resolved','Closed Unresolved'];
function statusClass(s){const m={'Open':'status-open','Awaiting Customer Form':'status-awaiting','Customer Form Received':'status-received','In Progress':'status-progress','Closed Resolved':'status-resolved','Closed Unresolved':'status-unresolved'};return m[s]||'status-open'}

// ── App Lifecycle ──
function getToken(){return sessionStorage.getItem(SESSION_KEY)}
function setToken(t){sessionStorage.setItem(SESSION_KEY,t)}
function clearToken(){sessionStorage.removeItem(SESSION_KEY)}

async function apiFetch(path,opts={}){
  const token=getToken();
  const res=await fetch(path,{...opts,headers:{...(opts.headers||{}),...(token?{Authorization:'Bearer '+token}:{}),'Content-Type':'application/json'}});
  return res;
}

async function login(password){
 if(!password)return false;
 // Standalone demo: accept any password
 setToken('demo-session-'+Date.now());
 return true;
}

function showGate(){
  document.getElementById('gate').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
  document.getElementById('password-input').value='';
  document.getElementById('gate-error').classList.add('hidden');
}
function showApp(){
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
}

async function boot(){
  if(getToken()){
    try {
      const res=await apiFetch('/api/reports');
      if(res.ok){showApp();loadTickets();return;}
    } catch(e){/* standalone mode — assume valid */}
    showApp();loadTickets();return;
  }
  showGate();
}

// ── Login UI ──
document.getElementById('login-btn').addEventListener('click',async()=>{
  const pw=document.getElementById('password-input').value;
  const err=document.getElementById('gate-error');
  err.classList.add('hidden');
  if(!pw)return;
  const ok=await login(pw);
  if(ok){showApp();loadTickets();}else{err.classList.remove('hidden')}
});
document.getElementById('password-input').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('login-btn').click()});

function handleLogout(){clearToken();showGate()}

// ── Load Tickets (paginated) ──
function getFilteredAll(){
  let f=[...mockTickets];
  if(state.shopFilter)f=f.filter(t=>t.shop===state.shopFilter);
  if(state.statusFilter)f=f.filter(t=>t.status===state.statusFilter);
  if(state.replyFilter==='yes')f=f.filter(t=>t.needs_reply);
  else if(state.replyFilter==='no')f=f.filter(t=>!t.needs_reply);
  if(state.searchQuery){const q=state.searchQuery.toLowerCase();f=f.filter(t=>t.order_id.toLowerCase().includes(q))}
  f.sort((a,b)=>(a.ticket_start||'').localeCompare(b.ticket_start||''));
  return f;
}

function loadTickets(){
  const all=getFilteredAll();
  const page=all.slice(0,PAGE_SIZE);
  state.tickets=page;
  state.hasMore=all.length>PAGE_SIZE;
  state.cursor=PAGE_SIZE;
  renderTicketList();
}

function loadMore(){
  const all=getFilteredAll();
  const more=all.slice(state.cursor,state.cursor+PAGE_SIZE);
  state.tickets=[...state.tickets,...more];
  state.cursor+=PAGE_SIZE;
  state.hasMore=state.cursor<all.length;
  renderTicketList();
}

function renderTicketList(){
  const list=document.getElementById('ticket-list');
  const countEl=document.getElementById('ticket-count-text');
  const loadMoreBtn=document.getElementById('load-more-btn');

  countEl.textContent=`${getFilteredAll().length} tickets (${state.tickets.length} shown)`;
  loadMoreBtn.classList.toggle('hidden',!state.hasMore);

  if(!state.tickets.length){
    list.innerHTML='<li class="empty-row">No tickets found</li>';
    return;
  }

  list.innerHTML=state.tickets.map(t=>{
    const active=state.selectedTicketId===t.id?' active':'';
    const badges=[];
    if(t.needs_reply)badges.push('<span class="badge badge-needs-reply">Needs Reply</span>');
    return `<li class="ticket-card${active}" data-id="${t.id}" onclick="selectTicket(${t.id})">
      <div class="tc-top">
        <span class="tc-order">${e(t.order_id)}</span>
        <span class="tc-status ${statusClass(t.status)}">${e(t.status)}</span>
      </div>
      <div class="tc-meta">
        <span class="shop-tag">${e(t.shop)}</span>
        <span>${e(t.ticket_start)}</span>
      </div>
      <div class="tc-preview">${e(t.description||'')}</div>
      ${badges.length?'<div class="tc-badges">'+badges.join('')+'</div>':''}
    </li>`;
  }).join('');
}

// ── Select Ticket ──
function selectTicket(id){
  const ticket=state.tickets.find(t=>t.id===id);
  if(!ticket)return;
  state.selectedTicketId=id;
  state.selectedTicket=ticket;
  document.querySelectorAll('.ticket-card').forEach(el=>el.classList.remove('active'));
  const el=document.querySelector(`.ticket-card[data-id="${id}"]`);
  if(el)el.classList.add('active');
  document.getElementById('detail-placeholder').classList.add('hidden');
  document.getElementById('detail-content').classList.remove('hidden');
  renderTicketDetail(ticket);
}

// ── Render Detail ──
function renderTicketDetail(ticket){
  // Track last seen message for idempotency
  const msgs=ticket.messages;
  const sorted=[...msgs].sort((a,b)=>(a.created_at||'').localeCompare(b.created_at||''));
  const lastMsg=sorted[sorted.length-1];
  ticket.last_seen_msg_at=lastMsg?lastMsg.created_at:'';

  // Header
  document.getElementById('detail-top').innerHTML=
    `<span class="order-id">${e(ticket.order_id)}</span>
     <span class="shop-tag">${e(ticket.shop)}</span>
     <span class="platform-tag">${e(ticket.platform)}</span>
     <a href="${e(ticket.url)}" target="_blank" rel="noopener" style="font-size:10px;color:var(--accent);text-decoration:none;">&#x2197; Mercari</a>
     <button class="refresh-btn" onclick="refreshMessages(${ticket.id})">&#x21BB; Refresh</button>`;

  // Info Grid
  const opts=STATUS_OPTIONS.map(s=>`<option value="${s}" ${ticket.status===s?'selected':''}>${s}</option>`).join('');
  document.getElementById('info-grid').innerHTML=
    `<div class="info-item"><div class="label">Status</div><select class="status-select" onchange="changeStatus(this.value)">${opts}</select></div>
     <div class="info-item"><div class="label">Ticket Start</div><div class="value">${e(ticket.ticket_start||'N/A')}</div></div>
     <div class="info-item"><div class="label">Customer</div><div class="value">${e(ticket.customer_name||'N/A')}</div></div>
     <div class="info-item"><div class="label">Product</div><div class="value">${e(ticket.product_name||'N/A')}</div></div>
     <div class="info-item"><div class="label">Latest Msg</div><div class="value" style="font-size:10px">${e(formatDate(ticket.latest_message_at))}</div></div>
     <div class="info-item"><div class="label">Needs Reply</div><div class="value" style="color:${ticket.needs_reply?'var(--danger)':'var(--text-muted)'}">${ticket.needs_reply?'Yes':'No'}</div></div>`;

  renderMessages(ticket);
  renderImages(ticket);
  renderDescription(ticket);
  renderNotes(ticket);

  // Composer
  document.getElementById('resolution-guide').value=ticket.resolution_guide||'';
  document.getElementById('draft-editor').value=ticket.ai_reply||'';
  document.getElementById('send-status').textContent='';
  document.getElementById('send-status').className='send-status';

  switchTab('messages');
}

function renderMessages(ticket){
  const c=document.getElementById('tab-messages');
  c.innerHTML=ticket.messages.map(m=>{
    const r=m.role==='BUYER'?'buyer':'seller';
    const l=m.role==='BUYER'?'Customer':'Us';
    return `<div class="msg-bubble ${r}"><div class="msg-meta">${l} &middot; ${e(formatDate(m.created_at))}</div><div>${e(m.message)}</div></div>`;
  }).join('');
}

function renderImages(ticket){
  const c=document.getElementById('tab-images');
  if(!ticket.images||!ticket.images.length){c.innerHTML='<p style="color:var(--text-muted);font-size:11px">No images</p>';return}
  c.innerHTML=ticket.images.map(i=>`<div class="image-card" onclick="openLightbox('${i.url}')"><img src="${i.url}" alt=""><div class="img-tag">${e(i.source)}</div></div>`).join('');
}

function renderDescription(ticket){
  const c=document.getElementById('tab-description');
  let h=`<div style="display:flex;justify-content:flex-end;margin-bottom:8px"><button class="btn-sm secondary" onclick="copyDescription(state.selectedTicket)" style="font-size:10px">Copy Description</button></div>`;
  if(ticket.order_id||ticket.seller||ticket.primary_item_code||ticket.product_name){
    h+=`<div class="desc-section" style="background:var(--warning-bg);border:1px solid #fcd34d;border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:10px">
      <h4 style="margin:0 0 6px;font-size:11px;color:var(--warning)">Product & Supplier</h4>`;
    if(ticket.order_id)h+=`<p style="margin:2px 0;font-size:11px"><strong>Order:</strong> <code style="font-size:11px">${e(ticket.order_id)}</code></p>`;
    if(ticket.product_name)h+=`<p style="margin:2px 0;font-size:11px"><strong>Product:</strong> ${e(ticket.product_name)}</p>`;
    if(ticket.primary_item_code)h+=`<p style="margin:2px 0;font-size:11px"><strong>SKU:</strong> <code style="font-size:11px">${e(ticket.primary_item_code)}</code></p>`;
    if(ticket.seller)h+=`<p style="margin:2px 0;font-size:11px"><strong>Seller (Supplier):</strong> ${e(ticket.seller)}</p>`;
    h+=`</div>`;
  }
  h+=`<div class="desc-section"><h4>Issue Summary</h4><p>${e(ticket.description||'No description')}</p></div>
       <div class="desc-section"><h4>Latest Customer Message</h4><p>${e(ticket.latest_message||'(none)')}</p><div class="form-label">${e(formatDate(ticket.latest_message_at))}</div></div>`;
  if(ticket.form_data)h+=`<div class="desc-section"><h4>Customer Form</h4><p><strong>Submitted:</strong> ${e(formatDate(ticket.form_data.submitted_at))}</p><p><strong>Description:</strong> ${e(ticket.form_data.description)}</p><p><strong>Expected Solution:</strong> ${e(ticket.form_data.expected_solution)}</p></div>`;
  if(ticket.resolution_guide)h+=`<div class="desc-section"><h4>Resolution Guide</h4><p>${e(ticket.resolution_guide)}</p></div>`;
  c.innerHTML=h;
}

function copyDescription(ticket){
  const parts=[];
  if(ticket.order_id)parts.push('Order ID: '+ticket.order_id);
  if(ticket.product_name)parts.push('Product: '+ticket.product_name);
  if(ticket.primary_item_code)parts.push('SKU: '+ticket.primary_item_code);
  if(ticket.seller)parts.push('Seller (Supplier): '+ticket.seller);
  parts.push('');
  parts.push('Issue Summary:');
  parts.push(ticket.description||'No description');
  parts.push('');
  parts.push('Latest Customer Message:');
  parts.push(ticket.latest_message||'(none)');
  if(ticket.latest_message_at)parts.push('('+formatDate(ticket.latest_message_at)+')');
  parts.push('');
  if(ticket.form_data){
    parts.push('Customer Form:');
    parts.push('Submitted: '+formatDate(ticket.form_data.submitted_at));
    parts.push('Description: '+ticket.form_data.description);
    parts.push('Expected Solution: '+ticket.form_data.expected_solution);
    parts.push('');
  }
  if(ticket.resolution_guide){
    parts.push('Resolution Guide:');
    parts.push(ticket.resolution_guide);
    parts.push('');
  }
  navigator.clipboard.writeText(parts.join('\n')).then(function(){
    toast('Description copied to clipboard','success');
  }).catch(function(){
    toast('Failed to copy','error');
  });
}

// ── Notes Tab ──
function renderNotes(ticket){
  const c=document.getElementById('tab-notes');
  let notesHtml=ticket.notes&&ticket.notes.length
    ?'<div class="notes-list">'+ticket.notes.map(n=>`<div class="note-item"><div class="note-header"><span class="note-date">${e(n.date)}</span></div><div class="note-text">${e(n.text)}</div></div>`).join('')+'</div>'
    :'<p style="color:var(--text-muted);font-size:11px;margin-bottom:12px">No internal notes yet.</p>';

  c.innerHTML=notesHtml+`
    <div class="note-form">
      <textarea id="note-input" placeholder="Add internal note... (not visible to customer)"></textarea>
      <div class="note-actions">
        <span style="font-size:9px;color:var(--text-xs);margin-right:auto">Internal use only</span>
        <button class="btn-sm secondary" onclick="addNote()">+ Add Note</button>
      </div>
    </div>`;
}

function addNote(){
  const ticket=state.selectedTicket;
  if(!ticket)return;
  const input=document.getElementById('note-input');
  const text=input.value.trim();
  if(!text)return;
  const now=new Date();
  const dateStr=now.toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  ticket.notes=ticket.notes||[];
  ticket.notes.push({date:dateStr,text});
  input.value='';
  renderNotes(ticket);
  toast('Note added','info');
  // Production: POST /api/tickets/:id/notes { text }
}

// ── Tab Switching ──
function switchTab(name){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector(`.tab-btn[onclick*="'${name}'"]`)?.classList.add('active');
  ['messages','images','description','notes'].forEach(t=>document.getElementById('tab-'+t).classList.add('hidden'));
  document.getElementById('tab-'+name).classList.remove('hidden');
}

// ── Execute Send ──
async function executeSend(){
  const ticket=state.selectedTicket;
  if(!ticket)return;
  const msg=document.getElementById('draft-editor').value.trim();
  closeConfirm();

  const btn=document.getElementById('btn-send');
  const statusEl=document.getElementById('send-status');
  btn.disabled=true;
  statusEl.textContent='Sending...';
  statusEl.className='send-status sending';

  // Production: POST /api/tickets/:id/send { message, last_seen_message_at: ticket.last_seen_msg_at }
  // Freshness check would happen on server side:
  //   - Refetch Mercari thread
  //   - Check hasSellerRepliedAfterLastBuyer()

  await new Promise(r=>setTimeout(r,1500));

  statusEl.className='send-status success';

}

// ── Lightbox ──
function openLightbox(url){document.getElementById('lightbox-img').src=url;document.getElementById('lightbox').classList.add('show')}
function closeLightbox(){document.getElementById('lightbox').classList.remove('show')}
async function downloadCurrentImage(){
  const img=document.getElementById('lightbox-img');
  const url=img.src;
  if(!url)return;
  toast('Downloading...','info');
  try{
    const res=await fetch(url);
    if(!res.ok)throw new Error('HTTP '+res.status);
    const blob=await res.blob();
    // Load into offscreen image via blob URL (same-origin, canvas-safe)
    const imgEl=new Image();
    await new Promise((resolve,reject)=>{imgEl.onload=resolve;imgEl.onerror=reject;imgEl.src=URL.createObjectURL(blob)});
    // Resize: max 1920px longest edge
    const MAX=1920;
    let w=imgEl.naturalWidth,h=imgEl.naturalHeight;
    if(w>MAX||h>MAX){const ratio=Math.min(MAX/w,MAX/h);w=Math.round(w*ratio);h=Math.round(h*ratio)}
    const canvas=document.createElement('canvas');
    canvas.width=w;canvas.height=h;
    const ctx=canvas.getContext('2d');
    ctx.drawImage(imgEl,0,0,w,h);
    const compressed=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',0.85));
    const a=document.createElement('a');
    a.href=URL.createObjectURL(compressed);
    a.download='image.jpg';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(a.href),100);
    toast('Image downloaded','success');
  }catch(e){
    window.open(url,'_blank');
    toast('Could not download directly. Image opened in new tab.','info');
  }
}

// ── Toast ──
let toastTimer;
function toast(msg,type='info'){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className=type+' show';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2500);
}

function e(str){if(!str)return '';return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function formatDate(iso){if(!iso)return 'N/A';try{const d=new Date(iso);return d.toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}catch{return iso}}

});
