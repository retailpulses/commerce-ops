# Install this file from an Nginx include that is inside the `http {}` context
# (Debian/Ubuntu sites-enabled is normally included there). The service itself
# listens only on loopback:3000.

map $uri $ticket_share_redacted_uri {
    "~^/tickets/share/[a-f0-9]{64}(?<safe_suffix>/.*)?$" "/tickets/share/[REDACTED]$safe_suffix";
    default $uri;
}

log_format ticket_share_redacted '$remote_addr - [$time_local] '
                                 '"$request_method $ticket_share_redacted_uri $server_protocol" '
                                 '$status $body_bytes_sent request_id=$request_id';

limit_conn_zone $binary_remote_addr zone=ticket_share_per_ip:10m;

upstream ticket_share_viewer {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 443 ssl http2;
    server_name seller-share.homesbliss.net;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/seller-share.homesbliss.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seller-share.homesbliss.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 30s;

    limit_conn ticket_share_per_ip 10;

    access_log /var/log/nginx/share-viewer-access.log ticket_share_redacted;
    error_log  /var/log/nginx/share-viewer-error.log;

    location / {
        limit_except GET { deny all; }
        proxy_pass http://ticket_share_viewer;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite, do not append, so the loopback-trusting app cannot be fed a spoofed chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        # Proxy timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Evidence must stream; do not buffer complete videos/files on the VPS.
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Deny direct access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# HTTP redirect to HTTPS
server {
    listen 80;
    server_name seller-share.homesbliss.net;
    access_log /var/log/nginx/share-viewer-access.log ticket_share_redacted;
    return 301 https://$server_name$request_uri;
}
