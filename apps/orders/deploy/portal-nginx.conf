# Portal UI nginx config for VPS bare-metal deployment (Issue 60).
# (Not Docker — see portal/nginx.conf for the Docker variant.)
#
# Deploy to: /etc/nginx/conf.d/portal.conf
# Reload:    nginx -t && systemctl reload nginx
#
# Cloudflare Tunnel handles TLS termination; internal traffic is plain HTTP.
#
# Canonical layout (see deploy/RELEASE_LAYOUT.md):
#   /opt/order-mgmt/current  ->  /opt/order-mgmt/releases/<sha>  (symlink)
# The `current` pointer is swapped atomically on deploy, so nginx and systemd
# always reference /opt/order-mgmt/current and never a bare SHA path.

server {
    listen 8080;
    # The OrderMgmt portal is one of the sibling Ops Portals. It is reached
    # under the canonical /order/ path on the shared ops host, and remains
    # available at its legacy root for rollback compatibility.
    server_name order.homesbliss.net;

    root /opt/order-mgmt/current/portal/dist;
    index index.html;

    # Gzip
    gzip on;
    # text/html is compressed by Nginx automatically and must not be repeated.
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Cache legacy-root static assets (fingerprinted)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache canonical /order/ static assets (fingerprinted).
    # alias strips the /order/ prefix so /order/assets/x.js maps to dist/assets/x.js.
    location /order/assets/ {
        alias /opt/order-mgmt/current/portal/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Canonical /order/ SPA (Vite base /order/).
    location /order/ {
        rewrite ^/order/(.*)$ /$1 break;
        root /opt/order-mgmt/current/portal/dist;
        try_files $uri $uri/ /index.html;
    }

    # Legacy SPA fallback (root) — retained for rollback compatibility.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Canonical API proxy /order/api/* → Portal API on port 8790.
    # The portal-api normalizes /order/api/portal/* → /api/portal/* internally.
    location /order/api/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    # Legacy API proxy (root) — retained for rollback compatibility.
    location /api/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
