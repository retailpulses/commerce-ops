server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    # text/html is compressed by Nginx automatically and must not be repeated.
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Legacy SPA fallback (root) — retained for rollback compatibility.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Canonical /order/ SPA (Vite base /order/).
    # alias strips the /order/ prefix so /order/assets/x.js maps to
    # /usr/share/nginx/html/assets/x.js.
    location /order/ {
        rewrite ^/order/(.*)$ /$1 break;
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Cache the /order/-prefixed (fingerprinted) static assets.
    location /order/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API calls to the local Portal API server (port 8790).
    # The portal-api normalizes /order/api/portal/* → /api/portal/*.
    location /order/api/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    # Legacy API proxy (root) — retained for rollback compatibility.
    location /api/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
}
