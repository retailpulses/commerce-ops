name: Ops Portal CI

on:
  pull_request:
    paths:
      - apps/ops-portal/**
      - .github/workflows/ops-portal-ci.yml
  push:
    branches: [main]
    paths:
      - apps/ops-portal/**
      - .github/workflows/ops-portal-ci.yml

permissions:
  contents: read

concurrency:
  group: ops-portal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/ops-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ops-portal/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
